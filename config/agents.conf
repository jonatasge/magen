# magen agent / provider recipes
#
# Only entries verified against official docs are listed.
# User overlay (merged after this file): ~/.config/magen/agents.conf
#
# Record format (blank line separates agents):
#   AGENT <id>
#   CMD <command> [command...]
#   HOME_RW <dotdir> [dotdir...]
#   HOME_RO <dotdir> [dotdir...]
#   CONFIG_RW <name> ...          # documentary (.config already RW)
#   PASS_ENV <VAR> ...
#   APP_SUPPORT <name> ...        # macOS Application Support
#   SET_ENV KEY=VAL ...
#   KEYCHAIN service|account|relpath|json_field
#
# GLOBAL_PASS_ENV may be repeated; always applied.
# Interactive shells activate ALL recipes; `sh -c` / scripts do not.

# Provider keys commonly documented across the CLIs below.
GLOBAL_PASS_ENV ANTHROPIC_API_KEY ANTHROPIC_AUTH_TOKEN ANTHROPIC_BASE_URL
GLOBAL_PASS_ENV OPENAI_API_KEY OPENAI_BASE_URL OPENAI_ORG_ID OPENAI_PROJECT_ID
GLOBAL_PASS_ENV CURSOR_API_KEY
GLOBAL_PASS_ENV GOOGLE_API_KEY GEMINI_API_KEY GOOGLE_GENAI_API_KEY GOOGLE_CLOUD_PROJECT GOOGLE_CLOUD_LOCATION
GLOBAL_PASS_ENV COPILOT_GITHUB_TOKEN GH_TOKEN GITHUB_TOKEN
GLOBAL_PASS_ENV XAI_API_KEY
GLOBAL_PASS_ENV KIMI_API_KEY KIMI_CODING_API_KEY
GLOBAL_PASS_ENV OPENROUTER_API_KEY DEEPSEEK_API_KEY GROQ_API_KEY
GLOBAL_PASS_ENV CONTINUE_API_KEY
GLOBAL_PASS_ENV OPENCODE_ZEN_API_KEY OPENCODE_GO_API_KEY

# https://cursor.com/docs/cli/reference/authentication
# https://cursor.com/docs/cli/changelog (AGENT_CLI_CREDENTIAL_STORE=file)
AGENT cursor
CMD agent cursor-agent
HOME_RW .cursor
PASS_ENV CURSOR_API_KEY NO_OPEN_BROWSER
APP_SUPPORT Cursor
SET_ENV AGENT_CLI_CREDENTIAL_STORE=file
KEYCHAIN cursor-access-token|cursor-user|.cursor/auth.json|accessToken
KEYCHAIN cursor-refresh-token|cursor-user|.cursor/auth.json|refreshToken

# https://code.claude.com/docs/en/cli
# https://code.claude.com/docs/en/env-vars
AGENT anthropic
CMD claude
HOME_RW .claude
PASS_ENV ANTHROPIC_API_KEY ANTHROPIC_AUTH_TOKEN ANTHROPIC_BASE_URL CLAUDE_CODE_OAUTH_TOKEN CLAUDE_CODE_OAUTH_REFRESH_TOKEN

# https://developers.openai.com/codex/auth
# https://github.com/openai/codex
AGENT openai
CMD codex
HOME_RW .codex
PASS_ENV OPENAI_API_KEY OPENAI_BASE_URL OPENAI_ORG_ID OPENAI_PROJECT_ID CODEX_API_KEY CODEX_HOME

# https://github.com/google-gemini/gemini-cli (docs/get-started/authentication.md)
AGENT google
CMD gemini
HOME_RW .gemini
PASS_ENV GEMINI_API_KEY GOOGLE_API_KEY GOOGLE_GENAI_API_KEY GOOGLE_CLOUD_PROJECT GOOGLE_CLOUD_LOCATION GOOGLE_GENAI_USE_VERTEXAI

# https://docs.github.com/en/copilot/how-tos/copilot-cli/set-up-copilot-cli/authenticate-copilot-cli
# https://docs.github.com/en/copilot/reference/copilot-cli-reference/cli-programmatic-reference (COPILOT_HOME)
AGENT microsoft
CMD copilot
HOME_RW .copilot
PASS_ENV COPILOT_GITHUB_TOKEN GH_TOKEN GITHUB_TOKEN COPILOT_HOME COPILOT_MODEL COPILOT_ALLOW_ALL

# https://docs.x.ai/build/overview
AGENT xai
CMD grok
HOME_RW .grok
PASS_ENV XAI_API_KEY

# https://www.kimi-cli.com/en/configuration/data-locations.html (~/.kimi)
# https://www.kimi.com/code/docs/en/kimi-code-cli/configuration/config-files (~/.kimi-code, KIMI_CODE_HOME)
AGENT moonshot
CMD kimi
HOME_RW .kimi .kimi-code
PASS_ENV KIMI_CODE_HOME KIMI_API_KEY KIMI_CODING_API_KEY

# https://opencode.ai/docs/cli/ (auth in ~/.local/share/opencode; config under ~/.config/opencode)
AGENT opencode
CMD opencode
CONFIG_RW opencode
PASS_ENV OPENCODE_CONFIG OPENCODE_CONFIG_DIR OPENCODE_SERVER_PASSWORD OPENCODE_SERVER_USERNAME

# https://docs.openclaw.ai/help/environment (~/.openclaw; provider keys via env / .env)
AGENT openclaw
CMD openclaw
HOME_RW .openclaw
PASS_ENV OPENCLAW_HOME OPENCLAW_STATE_DIR OPENCLAW_CONFIG_PATH OPENCLAW_LOAD_SHELL_ENV ANTHROPIC_API_KEY OPENAI_API_KEY XAI_API_KEY GOOGLE_API_KEY OPENROUTER_API_KEY

# https://hermes-agent.nousresearch.com/docs/user-guide/configuration
# https://hermes-agent.nousresearch.com/docs/reference/environment-variables
AGENT hermes
CMD hermes
HOME_RW .hermes
PASS_ENV HERMES_HOME OPENROUTER_API_KEY OPENAI_API_KEY ANTHROPIC_API_KEY GOOGLE_API_KEY GEMINI_API_KEY XAI_API_KEY KIMI_API_KEY KIMI_CODING_API_KEY DEEPSEEK_API_KEY OPENCODE_ZEN_API_KEY OPENCODE_GO_API_KEY

# https://aider.chat/docs/config/api-keys.html
# Config is ~/.aider.conf.yml (file), not a ~./aider directory.
AGENT aider
CMD aider
PASS_ENV OPENAI_API_KEY ANTHROPIC_API_KEY GEMINI_API_KEY OPENROUTER_API_KEY DEEPSEEK_API_KEY AIDER_OPENAI_API_KEY AIDER_API_KEY

# https://docs.continue.dev/cli/quickstart (cn; CONTINUE_API_KEY; ~/.continue)
AGENT continue
CMD cn
HOME_RW .continue
PASS_ENV CONTINUE_API_KEY ANTHROPIC_API_KEY
